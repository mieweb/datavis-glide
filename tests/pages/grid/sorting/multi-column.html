<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<script type="module" src="/index.js"></script>
		<link rel="stylesheet" href="../../base.css"/>
		<script type="module">
import { Source, ComputedView, Grid } from '/index.js';
document.addEventListener('DOMContentLoaded', function () {
	window.MIE = window.MIE || {};
	window.MIE.DEBUGGING = true;

	var source = new Source({
		type: 'http',
		url: '../../random100.json'
	});
	var view = new ComputedView(source);
	new Grid({
		id: 'grid',
		computedView: view,
		table: {
			groupMode: 'summary',
			whenGroup: {
				displayOrder: ['groupAggregates', 'rowVals']
			},
			whenPivot: {
				displayOrder: ['groupAggregates', 'rowVals', 'cells']
			},
			features: {
				limit: false,
				rowSelect: true,
				columnResize: true,
				columnReorder: true
			},
			columns: [
					'rowId'
				, 'string1'
				, 'country'
				, 'state'
				, 'fruit'
				, 'int1'
				, 'int2'
				, 'float1'
			]
		}
	}, {
		title: 'Test - Grid - Multi-Column Sort',
		helpText: 'Group-summary and pivot output for verifying multi-column sort indicators.',
		showControls: true
	});
});
		</script>
	</head>
	<body>
		<div id="grid"></div>
	</body>
</html>
