<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8"/>
		<script type="module" src="/index.js"></script>
		<link rel="stylesheet" href="../../base.css"/>
		<link rel="stylesheet" href="../../wcdatavis.css"/>
		<link rel="stylesheet" href="../../font-awesome.css"/>
		<script type="module">
import { Source, ComputedView, Grid } from '/index.js';
document.addEventListener('DOMContentLoaded', function () {
	window.MIE = window.MIE || {};
	window.MIE.DEBUGGING = true;

	const params = new URLSearchParams(document.location.search);
	const iconType = params.get('icon-type') || 'fontawesome';
	const opIcon = (fa, lucide) => iconType === 'fontawesome' ? fa : iconType === 'lucide' ? lucide : null;

	var source = new Source({
		type: 'http',
		url: '../../random100.json'
	});
	var view = new ComputedView(source);
	var grid = new Grid({
		id: 'grid',
		computedView: view,
		table: {
			features: {
				limit: false,
				rowSelect: true,
				operations: true,
			}
		},
		source: source,
	}, {
		title: 'Test - Grid - Operations - Delayed',
		showControls: true
	});
	view.on('getTypeInfo', function () {
		grid.setOperations({
			row: [{
				icon: opIcon('fa-search', 'search'),
				tooltip: 'Inspect',
				callback: function (row) {
					console.info('Performing "inspect" operation on row: %O', row);
				}
			}, {
				icon: opIcon('fa-trash', 'trash-2'),
				tooltip: 'Delete',
				callback: function (row) {
					console.info('Performing "delete" operation on row: %O', row);
				}
			}],
			cell: {
				'string1': [{
					icon: opIcon('fa-heart', 'heart'),
					tooltip: 'Like',
					callback: function (info) {
						console.info('Performing "like" operation on row: %O', info.row);
						info.cellElt.attr('data-liked', +!+info.cellElt.attr('data-liked'));
						info.opBtn.css('color', !!+info.cellElt.attr('data-liked') ? 'red' : '')
					}
				}, {
					icon: opIcon('fa-book', 'book'),
					tooltip: 'Look Up',
					callback: function (info) {
						window.open('https://www.thefreedictionary.com/' + encodeURI(info.cell), '_blank');
					}
				}]
			},
			all: [{
				icon: opIcon('fa-flask', 'flask-conical'),
				label: 'Take Ye Flask',
				callback: function (info) {
					alert(info.rows.length + ' rows selected');
				}
			}, {
				icon: opIcon('fa-battery-0', 'battery'),
				category: 'Power'
			}, {
				icon: opIcon('fa-battery-1', 'battery-low'),
				category: 'Power'
			}, {
				icon: opIcon('fa-battery-2', 'battery-medium'),
				category: 'Power'
			}, {
				icon: opIcon('fa-battery-3', 'battery-full'),
				category: 'Power'
			}, {
				icon: opIcon('fa-battery-4', 'battery-charging'),
				category: 'Power'
			}, {
				icon: opIcon('fa-thumbs-o-up', 'thumbs-up'),
				category: 'Rating',
				callback: function (sel) {
					alert('good');
				}
			}, {
				icon: opIcon('fa-thumbs-o-down', 'thumbs-down'),
				category: 'Rating',
				callback: function (sel) {
					alert('bad');
				}
			}]
		});
	});
});
		</script>
	</head>
	<body>
		<div id="grid"></div>
	</body>
</html>
